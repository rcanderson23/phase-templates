kind: token
version: v2
metadata:
  name: phase-templates-github
spec:
  roles: [Bot]
  join_method: github
  bot_name: phase-templates
  github:
    allow:
      - repository: rcanderson23/phase-templates
        ref: refs/heads/main
        workflow: Build Rust Builder
        environment: beams
      - repository: rcanderson23/phase-templates
        ref: refs/heads/main
        workflow: Install Rust App
        environment: beams
